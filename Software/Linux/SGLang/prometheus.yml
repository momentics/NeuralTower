global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sglang-production'
    scrape_interval: 5s
    static_configs:
      - targets: ['sglang-server:8000']
    metrics_path: '/v1/metrics'

  - job_name: 'sglang-health'
    scrape_interval: 10s
    static_configs:
      - targets: ['sglang-server:8000']
    metrics_path: '/health'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['prometheus:9093']