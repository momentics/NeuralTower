services:
  gpu-check:
    image: nvidia/cuda:12.8.0-base-ubuntu24.04
    container_name: neural_tower_gpu_check
    runtime: nvidia
    privileged: true
    volumes:
      - /var/log:/var/log
      - ../scripts/gpu_watchdog.sh:/gpu_watchdog.sh:ro
    command: ["/bin/bash", "/gpu_watchdog.sh"]
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]

  sglang-server:
    image: lmsysorg/sglang:latest
    container_name: sglang_core_server
    restart: always
    ipc: host
    network_mode: bridge
    ports:
      - "8000:8000"
    environment:
      # NCCL: изоляция трафика All-Reduce внутри NVLink-мезонинов
      - NCCL_P2P_LEVEL=NVL
      - NCCL_IB_DISABLE=1
      - NCCL_NET_PLUGIN=none
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0,1,2,3}
    volumes:
      # Локальное хранилище моделей
      - ${MODELS_PATH:-/opt/llm/models}:/models:ro
      # NVMe Intel DC P4510 для HiCache L3 (файловый бэкенд)
      - ${KV_CACHE_PATH:-/nvme/sglang_kv_cache}:/nvme/sglang_kv_cache:rw
      - /var/log:/var/log
    depends_on:
      gpu-check:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    command: >
      python3 -m sglang.launch_server
      --model ${MODEL_PATH:-/models/Qwen3.6-27B-Instruct}
      --host 0.0.0.0
      --port 8000
      --tp-size ${TP_SIZE:-2}
      --pp-size ${PP_SIZE:-2}
      --dtype float16
      --kv-cache-dtype int8
      --attention-backend triton
      --context-length 1000000
      --chunked-prefill-size 4096
      --enable-dynamic-chunking
      --enable-mixed-chunk
      --mem-fraction-static ${MEM_FRACTION_STATIC:-0.50}
      --cuda-graph-max-bs ${CUDA_GRAPH_MAX_BS:-4}
      --enable-hierarchical-cache
      --hicache-size ${HICACHE_SIZE_GB:-30}
      --hicache-storage-backend file
      --speculative-algorithm EAGLE
      --speculative-draft-model-path ${EAGLE_DRAFT_MODEL_PATH:-/models/EAGLE-Qwen3.6-27B-Instruct}
      --speculative-num-steps 3
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 4

  gpu-watchdog:
    image: nvidia/cuda:12.8.0-base-ubuntu24.04
    container_name: neural_tower_gpu_watchdog
    runtime: nvidia
    privileged: true
    volumes:
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - ../scripts/gpu_watchdog_loop.sh:/gpu_watchdog_loop.sh:ro
    command: ["/bin/bash", "/gpu_watchdog_loop.sh"]
    depends_on:
      - sglang-server
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_storage:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_storage:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_storage:
  grafana_storage:
